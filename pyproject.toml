[project]
name = "adelaide-jobs"
version = "0.1.0"
description = "Pipeline pessoal de descoberta de vagas em Adelaide, SA"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ats = ["ats-scrapers>=0.2.0"]
sheets = ["gspread>=6.0", "google-auth>=2.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
adelaide-jobs = "adelaide_jobs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
