profile_version: "2026.08"

identity:
  name: "Pedro Albertasse"
  arrival_date: 2026-09-24

visa:
  subclass: 500
  condition: 8105
  cap_hours_fortnight: 48
  # Teto operacional abaixo do legal: turno casual estoura, e a
  # responsabilidade pelo limite é sua, não do empregador.
  operational_cap: 44

study:
  provider: "ILSC Adelaide"
  address: "115 Grenfell St, Adelaide SA 5000"
  lat: -34.9235
  lon: 138.6055
  # AM | PM | UNKNOWN — trava ou destrava turnos inteiros.
  # Deixe UNKNOWN até a matrícula confirmar. O scorer trata
  # conflito de horário como penalidade parcial enquanto for UNKNOWN.
  class_pattern: UNKNOWN

english:
  cefr_on_arrival: A2
  # ⇩ ATUALIZE ISTO conforme o inglês melhorar. É o campo que mais muda
  # o resultado. A1 A2 B1 B2 C1 C2.
  #
  # Ao subir de nível, duas coisas acontecem sozinhas: vaga com
  # atendimento ao cliente para de ser penalizada, e o peso da dimensão
  # de inglês cai (porque deixa de ser o gargalo), sendo redistribuído
  # entre as outras. A soma continua 100, então as notas de meses
  # diferentes seguem comparáveis.
  #
  # Depois de mudar aqui, rode:  adelaide-jobs score --rescore
  current_level: A2

transport:
  has_au_drivers_licence: false
  has_car: false
  max_commute_km: 25
  # Turno que termina depois disso tem risco de não ter transporte
  # de volta ao CBD.
  late_return_risk_after: "23:30"

experience_years:
  hospitality: 0
  retail: 0
  warehouse: 0
  cleaning: 0
  office_data: 3

certifications: []   # RSA, White Card, Food Handling: nenhum ainda

objectives:
  primary: CASUAL_ENTRY_BACK_OF_HOUSE
  secondary: OFFICE_ADMIN_DATA
  # Terceiro alvo: a formação dele. Peso pequeno (career_bridge = 4),
  # de propósito — não pode dominar a fila nos primeiros meses. Mas se
  # aparecer vaga boa de dados, games ou design, ela tem que ser vista.
  tertiary: TECH_GAMES_DESIGN

# ─── Pesos do score (somam 100) ─────────────────────────────────────
# Versionados: mude o número da versão ao mexer nos pesos, para
# conseguir comparar resultados antes/depois.
scoring:
  version: "w1"
  weights:
    experience_barrier: 25
    english_load: 20
    visa_hours_fit: 15
    commute: 12
    shift_fit: 10
    certification_barrier: 8
    employer_pattern: 6
    career_bridge: 4
  # Penalidade aplicada a anúncio repostado sem mudança de conteúdo.
  ghost_penalty: 15
  # Score mínimo para a vaga aparecer na fila de candidatura.
  # O relatório HTML mostra TUDO, com filtro por nota — este corte vale
  # para `queue` e para o CSV.
  queue_threshold: 55

# Faixas de nota. Mudar aqui não muda o score, só como ele é rotulado.
#   A+  89-100  candidate-se hoje
#   A   78-88   muito boa
#   A-  70-77   boa
#   B+  62-69   vale olhar
#   B   55-61   talvez
#   C   40-54   só se estiver seco
#   D    0-39   provavelmente não
#   X           bloqueada por um knockout

