# ════════════════════════════════════════════════════════════════════
#  Fontes de coleta. `enabled: false` deixa o código pronto mas
#  desligado — nada roda sem você mandar.
# ════════════════════════════════════════════════════════════════════

adzuna:
  enabled: true
  legitimacy: official_api      # API oficial, chave gratuita
  country: au
  where: "Adelaide"
  distance_km: 25
  # Termos de busca. Um request por termo.
  # ── VARREDURA POR CATEGORIA (é daqui que vem o volume) ───────────
  # Profundidade por categoria, não uma só para todas. O número ao lado
  # de cada uma é quantas vagas ela REALMENTE tem em Adelaide num raio
  # de 25 km, medido na API em 30/08/2026 — não é estimativa.
  #
  # 50 vagas por página. `páginas × 50` é o teto do que se coleta.
  # Onde o total é menor que isso, a varredura pega a categoria inteira
  # e para sozinha.
  categories:
    # ── Saúde e aged care: a maior de todas, e ninguém olhava ──────
    healthcare-nursing-jobs: 10     # 3.141 vagas · pega 500
    social-work-jobs: 7             #   484       · pega 350
    # ── Hospitalidade: restaurante, café e hotel, tudo junto ───────
    hospitality-catering-jobs: 10   # 1.262       · pega 500
    # ── Escritório (objetivo secundário) ───────────────────────────
    admin-jobs: 8                   # 1.094       · pega 400
    accounting-finance-jobs: 7      #   711       · pega 350 — é aqui
                                    #   que mora "Reporting Officer",
                                    #   "Finance Analyst" e boa parte
                                    #   do trabalho de relatório
    consultancy-jobs: 4             #   205       · pega inteira
    customer-services-jobs: 8       #   401       · pega a categoria inteira
    hr-jobs: 7                      #   340       · pega inteira — é o
                                    #   segmento da Flow: recrutamento
                                    #   e executive search em Adelaide
    # ── Varejo e logística ─────────────────────────────────────────
    retail-jobs: 8                  #   905       · pega 400
    logistics-warehouse-jobs: 8     #   958       · pega 400
    # ── Formação dele: dados, games, design ────────────────────────
    it-jobs: 7                      #   815       · pega 350
    creative-design-jobs: 2         #    70       · pega inteira
    # ── Transversais ───────────────────────────────────────────────
    part-time-jobs: 6               #   275       · pega inteira
    domestic-help-cleaning-jobs: 5  #   226       · pega inteira
  # Categorias medidas e DESCARTADAS: other-general-jobs tem 20 vagas em
  # Adelaide. Não vale a requisição.
  #
  # Soma: 86 requisições de categoria. Com os 41 termos × 2 páginas = 82,
  # dá 168 das 250 diárias. Sobra folga para uma segunda rodada parcial.
  daily_request_budget: 250

  # ── BUSCA POR PALAVRA ────────────────────────────────────────────
  # Isto aqui não é "complemento". Metade do mercado australiano só é
  # encontrável pelo termo local exato. Descoberto em 27/08/2026 com sete
  # agentes de pesquisa, verificando anúncios reais de Adelaide:
  #
  #   "night fill"  → ZERO.   "nightfill" (uma palavra só) → resultados.
  #   "dishwasher"  → ZERO.   Na Austrália a palavra é a MÁQUINA, não a
  #                           pessoa. Quem lava louça é "kitchen hand",
  #                           "kitchen porter", "pot wash" ou "glassie".
  #   "storeperson" é o termo nº 1 de armazém e não tem equivalente óbvio
  #                           em inglês americano — sem ele você perde
  #                           metade das vagas de logística.
  #
  # Cada termo custa uma requisição por página. 40 termos × 2 páginas = 80.
  # Com as categorias: 128 de 250 por dia. Dá para rodar duas vezes.
  queries:
    # ── cozinha (back of house) ────────────────────────────────────
    - kitchen hand
    - kitchenhand
    - kitchen assistant
    - kitchen porter
    - kitchen steward
    - pot wash
    - food services assistant
    - catering assistant
    - food production
    - commis chef
    # ── salão / eventos ────────────────────────────────────────────
    - food and beverage attendant
    - cafe all rounder
    - wait staff
    - glass collector
    - banquet attendant
    - event staff
    # ── quarto / limpeza ───────────────────────────────────────────
    - housekeeping
    - room attendant
    - public area attendant
    - houseperson
    - laundry attendant
    - commercial cleaner
    - casual cleaner
    - hotel services assistant
    # ── supermercado (turno noturno) ───────────────────────────────
    - nightfill
    - store team member
    - grocery team member
    - replenishment
    - trolley collection
    # ── armazém ────────────────────────────────────────────────────
    - storeperson
    - pick packer
    - order picker
    - freight handler
    - process worker
    - factory hand
    # ── modificadores de alto rendimento ───────────────────────────
    # Não são cargos, são as palavras que o anúncio usa quando aceita
    # gente sem experiência local. É o filtro dele, escrito por eles.
    - no experience
    - immediate start
    # ── formação: dados, games, design ─────────────────────────────
    # ATENÇÃO: "gaming" sozinho NÃO entra. Na Austrália "gaming" quer
    # dizer cassino e caça-níquel ("Gaming Attendant", "pokies"), não
    # jogos digitais. O termo certo é "game developer".
    - power bi
    - data analyst
    - game developer
    - ux designer
    # ── a profissão dele: DADOS ────────────────────────────────────
    # Medido em 30/08/2026: "power bi" devolve 119 em Adelaide,
    # "data analyst" só 34. Buscar pela ferramenta rende mais que
    # pelo nome do cargo.
    - business analyst
    - reporting analyst
    - business intelligence
    - dashboard
    - salesforce
  results_per_page: 50
  max_pages: 2
  # Limites publicados nos termos da Adzuna: 25/min, 250/dia, 2500/mês.
  min_seconds_between_calls: 3

ats:
  enabled: true
  legitimacy: public_endpoint   # endpoints públicos dos empregadores
  # Requer: pip install "adelaide-jobs[ats]"
  targets:
    - name: Bunnings
      kind: workday
      url: https://bunnings.wd3.myworkdayjobs.com/careers
    - name: Hungry Jack's
      kind: workday
      url: https://hungryjacks.wd105.myworkdayjobs.com/HungryJacksCareers
    - name: Flinders University
      kind: workday
      url: https://flinders.wd3.myworkdayjobs.com/flinders_employment
    - name: McDonald's Australia
      kind: smartrecruiters
      slug: McDonaldsAustralia
    - name: Guzman y Gomez
      kind: smartrecruiters
      slug: GuzmanYGomez
    # Verificado em 27/08/2026: a Posting API pública do SmartRecruiters
    # responde sem chave em /v1/companies/ALDIStores/postings. Lojas de
    # Adelaide + centro de distribuição de Regency Park.
    - name: ALDI Australia
      kind: smartrecruiters
      slug: ALDIStores
  # Só guarda vagas cuja localização casa com um destes.
  location_filter:
    - adelaide
    - south australia
    - " sa "
    - " sa,"

pageup:
  # O ATS do setor público de Adelaide. Descoberto em 27/08/2026: o SA
  # Health sozinho tem ~625 vagas ativas, quase todas na Grande Adelaide,
  # e hospital emprega muito back of house — Hotel Services Assistant,
  # Food Services Assistant, Cleaner, Ward Assistant.
  #
  # A listagem é HTML e pagina com ?page=N (24 por página, medido no
  # navegador). A página de DETALHE bloqueia cliente sem navegador, então
  # a descrição vem vazia e a vaga pontua pelo título. Clique em
  # "Candidatar-se" para ler o anúncio inteiro.
  enabled: true
  legitimacy: open_robots
  # 30 páginas × 24 = 720, mais que as 625 do SA Health. O coletor para
  # sozinho quando a paginação repete, então sobra folga sem custo.
  max_pages: 30
  # Descarta o que não é Grande Adelaide (Whyalla, Port Lincoln, Mount
  # Gambier). Ponha false se quiser o estado inteiro.
  only_metro: true
  targets:
    - name: SA Health
      url: https://careers.sahealth.sa.gov.au/caw/en/listing/

seek_v5:
  # ⚠️ DESLIGADO POR PADRÃO — LEIA ANTES DE LIGAR.
  #
  # A v5 é a API interna do SEEK, sem autenticação. Ela funciona e
  # aceita `where=All Adelaide SA`. Usá-la viola os Termos de Uso do
  # SEEK, que proíbem acesso automatizado.
  #
  # Isso não é crime — é inadimplemento contratual. Mas a consequência
  # prática é bloqueio de IP ou da conta, e a sua conta do SEEK vai ser
  # o canal principal de emprego da cidade onde você mora.
  #
  # Se ligar: rate limit conservador, uma requisição por vez, e nunca
  # na mesma sessão/IP em que você navega logado.
  enabled: false
  legitimacy: against_tos
  where: "All Adelaide SA"
  # Código da classificação. Descubra filtrando no site do SEEK e
  # lendo o número na URL — não confie em lista achada em blog.
  # 6281 = Information & Communication Technology (exemplo).
  classification: ""
  page_size: 20
  max_pages: 3
  min_seconds_between_calls: 8

email_alerts:
  # ── O SEEK E O LINKEDIN, PELA PORTA QUE ELES DEIXAM ABERTA ───────
  #
  # Nenhum dos dois tem API pública e os dois proíbem acesso
  # automatizado. Mas os dois mandam alerta por e-mail: você assina,
  # eles entregam, e o e-mail é seu. Ler a própria caixa não viola
  # termo nenhum — a plataforma está entregando o dado de propósito.
  #
  # Sai título e link. Não sai descrição. Quando o mesmo anúncio também
  # vier da Adzuna ou de um ATS, a deduplicação junta os dois e a
  # descrição vem do outro lado.
  #
  # PARA LIGAR (5 minutos, uma vez só):
  #   1. Crie uma conta Gmail só para isto.
  #   2. Ative a verificação em duas etapas:
  #      https://myaccount.google.com/security
  #   3. Crie uma senha de app em:
  #      https://myaccount.google.com/apppasswords
  #      Nome: coletor-vagas. Copie o código de 16 caracteres.
  #   4. No .env:  IMAP_USER=seuemail@gmail.com
  #                IMAP_PASSWORD=<a senha de app, NÃO a da conta>
  #   5. No Gmail, crie o rótulo "Vagas" e um filtro por remetente que
  #      jogue os alertas nele. Rótulo do Gmail é pasta do IMAP.
  #   6. Assine os alertas DIÁRIOS de SEEK, Indeed AU, LinkedIn e
  #      iworkfor.sa.gov.au usando esse endereço.
  #   7. Troque a linha abaixo para `enabled: true`.
  #
  # Prefira muitos alertas estreitos a poucos amplos: cada e-mail mostra
  # só os primeiros resultados e o resto some sem aviso.
  enabled: false
  legitimacy: own_data
  # Pasta/rótulo a ler. Com uma pasta dedicada, não precisa filtrar por
  # remetente — tudo que está lá é alerta.
  folder: "Vagas"
  # Quantos dias para trás. 3 cobre um fim de semana sem duplicar muito
  # (a deduplicação resolve o resto).
  since_days: 3
  # Deixe vazio para ler a pasta inteira. Preencha só se apontar o
  # coletor para a INBOX, o que não é recomendado.
  senders: []
  #  - jobmail@seek.com.au
  #  - jobs-noreply@linkedin.com
  #  - jobalerts-noreply@linkedin.com
  #  - alert@indeed.com
  #  - noreply@au.indeed.com
  #  - noreply@jora.com
